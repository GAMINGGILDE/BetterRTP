name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Java 25 einrichten
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Release-Version ermitteln
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release-Tags müssen beispielsweise v3.7, v4.0.0 oder v4.0.0-rc.1 entsprechen; erhalten: '${tag}'." >&2
            exit 1
          fi

          version="${tag#v}"
          project_version="$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "${project_version}" != "${version}" ]]; then
            echo "Tag-Version '${version}' stimmt nicht mit der Projektversion '${project_version}' überein." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Release-JAR bauen und testen
        run: ./mvnw clean verify --batch-mode --no-transfer-progress

      - name: Paper 26.1.2 Smoke-Test
        shell: bash
        run: >-
          bash .github/scripts/server-smoke-test.sh
          "paper"
          "https://fill-data.papermc.io/v1/objects/1d70b1dab9cf4a6de615209a536f3a45a2186240253c428213ce2188ab95e5f7/paper-26.1.2-74.jar"
          "1d70b1dab9cf4a6de615209a536f3a45a2186240253c428213ce2188ab95e5f7"
          "target/BetterRTP-${{ steps.release.outputs.version }}.jar"

      - name: Folia 26.1.2 Smoke-Test
        shell: bash
        run: >-
          bash .github/scripts/server-smoke-test.sh
          "folia"
          "https://fill-data.papermc.io/v1/objects/607afd1c3320008e1ffd2eaee6780ace4419d5f8c527b75e79f259be79ebf57b/folia-26.1.2-8.jar"
          "607afd1c3320008e1ffd2eaee6780ace4419d5f8c527b75e79f259be79ebf57b"
          "target/BetterRTP-${{ steps.release.outputs.version }}.jar"

      - name: Release-Dateien vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.version }}"
          mkdir -p release
          cp "target/BetterRTP-${version}.jar" "release/BetterRTP-${version}.jar"
          cd release
          sha256sum "BetterRTP-${version}.jar" > "BetterRTP-${version}.jar.sha256"

      - name: GitHub Release erstellen oder aktualisieren
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.release.outputs.tag }}"
          version="${{ steps.release.outputs.version }}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" release/* --clobber
          else
            gh release create "${tag}" release/* \
              --title "BetterRTP ${version}" \
              --generate-notes
          fi
