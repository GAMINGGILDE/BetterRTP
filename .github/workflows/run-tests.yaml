name: CI

on:
  push:
    branches:
      - master
      - 4.x
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Java 25 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Projekt bauen
        run: mvn clean verify --batch-mode --no-transfer-progress
