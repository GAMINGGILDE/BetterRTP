name: CI

on:
  push:
    branches:
      - master
      - 4.x
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Java 25 einrichten
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Projekt bauen
        run: ./mvnw clean verify --batch-mode --no-transfer-progress

      - name: Plugin-JAR bereitstellen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BetterRTP-${{ github.sha }}
          path: target/BetterRTP-*.jar
          if-no-files-found: error
          retention-days: 14

  server-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: paper
            url: https://fill-data.papermc.io/v1/objects/1d70b1dab9cf4a6de615209a536f3a45a2186240253c428213ce2188ab95e5f7/paper-26.1.2-74.jar
            sha256: 1d70b1dab9cf4a6de615209a536f3a45a2186240253c428213ce2188ab95e5f7
          - server: folia
            url: https://fill-data.papermc.io/v1/objects/607afd1c3320008e1ffd2eaee6780ace4419d5f8c527b75e79f259be79ebf57b/folia-26.1.2-8.jar
            sha256: 607afd1c3320008e1ffd2eaee6780ace4419d5f8c527b75e79f259be79ebf57b

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Java 25 einrichten
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Plugin-JAR herunterladen
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: BetterRTP-${{ github.sha }}
          path: artifacts

      - name: ${{ matrix.server }} starten und BetterRTP prüfen
        shell: bash
        run: >-
          bash .github/scripts/server-smoke-test.sh
          "${{ matrix.server }}"
          "${{ matrix.url }}"
          "${{ matrix.sha256 }}"
          artifacts/BetterRTP-4.0.0-SNAPSHOT.jar
